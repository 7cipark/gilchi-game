<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>길치와짐꾼 블록 쌓기</title>
<style>
  :root{--bg:#fff7e8;--ink:#1d1d1d;--main:#8a4b14;--accent:#e0a03a;--fs:26px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:var(--fs);line-height:1.4;user-select:none}
  .wrap{max-width:560px;margin:0 auto;padding:10px}
  header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-size:1.05em;margin:4px 0;color:var(--main)}
  .tools button{font-size:.6em;padding:8px 12px;margin-left:5px;border:2px solid var(--main);background:#fff;border-radius:12px;cursor:pointer}
  .card{background:#fff;border:3px solid var(--main);border-radius:18px;padding:16px;margin:10px 0;text-align:center}
  .big{font-size:1.5em;font-weight:700}.small{font-size:.6em;color:#666}.hidden{display:none!important}
  .primary{display:block;width:100%;font-size:1em;padding:16px;margin-top:12px;border:0;border-radius:16px;background:var(--main);color:#fff;font-weight:700;cursor:pointer;min-height:64px}
  .speeds{display:flex;gap:8px;margin-top:10px}
  .speeds button{flex:1;font-size:.9em;padding:14px 4px;border:3px solid var(--main);background:#fff;border-radius:14px;font-weight:700;cursor:pointer}
  .speeds button.on{background:var(--accent);border-color:#5a3a00}
  .stage{display:flex;gap:10px;justify-content:center;align-items:flex-start}
  #board{background:#2a1f16;border:4px solid var(--main);border-radius:10px;width:min(58vw,300px);height:auto;aspect-ratio:1/2}
  .side{width:min(30vw,150px);font-size:.62em;text-align:center}
  .side .box{background:#fff;border:3px solid var(--main);border-radius:12px;padding:6px;margin-bottom:8px}
  .side b{display:block;font-size:1.5em;color:var(--main)}
  #next{width:100%;height:auto;aspect-ratio:1/1;background:#2a1f16;border-radius:8px}
  .pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
  .pad button{font-size:.8em;font-weight:700;padding:0;height:78px;border:3px solid var(--main);background:#fff;border-radius:16px;cursor:pointer;color:var(--ink)}
  .pad button:active{background:var(--accent)}
  .pad .wide{grid-column:span 2}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .row2 button{font-size:.7em;height:56px;border:3px solid var(--main);background:#fff;border-radius:14px;cursor:pointer;font-weight:700}
  .over{position:relative}
  .msg{margin-top:8px;font-size:.7em;color:#555;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>길치와짐꾼 블록 쌓기</h1>
    <div class="tools">
      <button id="fm" aria-label="글자 작게">가-</button>
      <button id="fp" aria-label="글자 크게">가+</button>
      <button id="snd" aria-label="소리">소리 켜짐</button>
    </div>
  </header>

  <section id="start" class="card">
    <p class="big">블록을 쌓아<br>줄을 채워 보세요</p>
    <p>한 줄이 꽉 차면 사라져요.<br>천천히, 편하게 하세요.</p>
    <p class="small">속도를 골라 주세요</p>
    <div class="speeds">
      <button data-s="1100">느림</button>
      <button data-s="800" class="on">보통</button>
      <button data-s="550">빠름</button>
    </div>
    <p class="small">최고 점수: <span id="best0">0</span></p>
    <button class="primary" id="go">시작하기</button>
  </section>

  <section id="game" class="hidden">
    <div class="stage">
      <canvas id="board" width="300" height="600"></canvas>
      <div class="side">
        <div class="box">점수<b id="score">0</b></div>
        <div class="box">지운 줄<b id="lines">0</b></div>
        <div class="box">최고<b id="best">0</b></div>
        <div class="box">다음<canvas id="next" width="120" height="120"></canvas></div>
      </div>
    </div>
    <div class="pad">
      <button id="bl" aria-label="왼쪽">왼쪽</button>
      <button id="br" aria-label="오른쪽">오른쪽</button>
      <button id="bd" aria-label="내리기">내리기</button>
      <button id="bu" aria-label="돌리기">돌리기</button>
    </div>
    <div class="row2">
      <button id="bdrop">바로 내리기</button>
      <button id="bpause">잠깐 쉬기</button>
    </div>
    <p class="msg">키보드: 방향키, 위쪽=돌리기, 스페이스=바로 내리기, P=쉬기</p>
  </section>

  <section id="end" class="card hidden">
    <p class="big" id="res"></p>
    <p id="resmsg"></p>
    <button class="primary" id="again">다시 하기</button>
  </section>

  <p id="donate" class="small center hidden" style="text-align:center">마음에 드셨다면 <a id="donateLink" href="#" target="_blank" rel="noopener" style="color:#8a4b14;font-weight:700">응원하기(선택)</a> &nbsp;·&nbsp; 게임은 계속 무료예요.</p>
  <p class="small" style="text-align:center"><a href="../" style="color:#8a4b14">게임방으로 돌아가기</a> · 길치와짐꾼 채널과 함께하는 블록 게임이에요.</p>
</div>

<script>
const $=id=>document.getElementById(id);
const DONATE_URL="";
if(DONATE_URL){$("donateLink").href=DONATE_URL;$("donate").classList.remove("hidden")}
function load(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let fs=parseInt(load("fs_b","26"));document.documentElement.style.setProperty("--fs",fs+"px");
function setFs(d){fs=Math.min(36,Math.max(20,fs+d));document.documentElement.style.setProperty("--fs",fs+"px");save("fs_b",fs)}
$("fm").onclick=()=>setFs(-3);$("fp").onclick=()=>setFs(3);

/* 소리 */
let sound=load("snd_b","1")==="1",AC=null,MG=null;
$("snd").textContent=sound?"소리 켜짐":"소리 꺼짐";
function tone(f,t0,d,type,vol){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();c.threshold.value=-10;c.ratio.value=8;const m=AC.createGain();m.gain.value=1.6;c.connect(m);m.connect(AC.destination);MG=c}if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;o.connect(g);g.connect(MG);const s=AC.currentTime+t0;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||0.4,s+0.015);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d+0.05)}catch(e){}}
function bell(f,t0,d,v){tone(f,t0,d,"sine",v);tone(f*2,t0,d*.7,"sine",v*.4);tone(f*3,t0,d*.4,"sine",v*.15)}
function sfx(k){if(!sound)return;
  if(k==="move")tone(500,0,.05,"square",.08);
  else if(k==="rot")tone(760,0,.07,"square",.1);
  else if(k==="lock")tone(180,0,.12,"triangle",.4);
  else if(k==="line1"){bell(1319,0,.4,.5);bell(1568,.2,.6,.5)}
  else if(k==="line"){bell(1319,0,.5,.5);bell(1047,.3,.5,.5);bell(1568,.6,.9,.55)}
  else if(k==="over"){tone(150,0,.7,"sawtooth",.45);tone(158,0,.7,"square",.25)}
  else if(k==="start"){bell(523,0,.3,.45);bell(659,.14,.3,.45);bell(784,.28,.6,.5)}}
$("snd").onclick=()=>{sound=!sound;save("snd_b",sound?"1":"0");$("snd").textContent=sound?"소리 켜짐":"소리 꺼짐";sfx("line1")};

/* 게임 */
const COLS=10,ROWS=20,CS=30;
const SH={I:[[0,1],[1,1],[2,1],[3,1]],O:[[1,0],[2,0],[1,1],[2,1]],T:[[1,0],[0,1],[1,1],[2,1]],S:[[1,0],[2,0],[0,1],[1,1]],Z:[[0,0],[1,0],[1,1],[2,1]],J:[[0,0],[0,1],[1,1],[2,1]],L:[[2,0],[0,1],[1,1],[2,1]]};
const COL={I:"#4fc3d9",O:"#f2c94c",T:"#a77bd6",S:"#6fcf7a",Z:"#eb6b6b",J:"#5b8fe8",L:"#f2994a"};
const KEYS=Object.keys(SH);
const cv=$("board"),cx=cv.getContext("2d"),nv=$("next"),nx=nv.getContext("2d");
let grid,cur,nxt,score,lines,best=parseInt(load("best_b","0"))||0,speed=800,timer=null,running=false,paused=false,bag=[];
$("best0").textContent=best;$("best").textContent=best;
function rnd(){if(!bag.length){bag=KEYS.slice();for(let i=bag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()}
function mk(t){return{t:t,c:SH[t].map(p=>p.slice()),x:3,y:0}}
function rot(c,t){if(t==="O")return c.map(p=>p.slice());const n=t==="I"?4:3;return c.map(p=>[n-1-p[1],p[0]])}
function ok(c,x,y){return c.every(p=>{const a=x+p[0],b=y+p[1];return a>=0&&a<COLS&&b<ROWS&&(b<0||!grid[b][a])})}
function spawn(){cur=nxt||mk(rnd());cur.x=3;cur.y=0;nxt=mk(rnd());drawNext();if(!ok(cur.c,cur.x,cur.y)){over()}}
function lock(){cur.c.forEach(p=>{const a=cur.x+p[0],b=cur.y+p[1];if(b>=0)grid[b][a]=cur.t});
  let n=0;for(let r=ROWS-1;r>=0;){if(grid[r].every(v=>v)){grid.splice(r,1);grid.unshift(Array(COLS).fill(null));n++}else r--}
  if(n){lines+=n;score+=[0,100,300,500,800][n];sfx(n>=2?"line":"line1")}else sfx("lock");
  upd();spawn()}
function upd(){$("score").textContent=score;$("lines").textContent=lines;if(score>best){best=score;save("best_b",best);$("best").textContent=best}}
function step(){if(!running||paused)return;if(ok(cur.c,cur.x,cur.y+1)){cur.y++}else{lock()}draw()}
function mv(dx){if(!running||paused)return;if(ok(cur.c,cur.x+dx,cur.y)){cur.x+=dx;sfx("move");draw()}}
function down(){if(!running||paused)return;if(ok(cur.c,cur.x,cur.y+1)){cur.y++;score+=1;upd();draw()}else{lock();draw()}}
function turn(){if(!running||paused)return;const r=rot(cur.c,cur.t);for(const k of [0,-1,1,-2,2]){if(ok(r,cur.x+k,cur.y)){cur.c=r;cur.x+=k;sfx("rot");draw();return}}}
function drop(){if(!running||paused)return;let n=0;while(ok(cur.c,cur.x,cur.y+1)){cur.y++;n++}score+=n*2;lock();draw()}
function cell(c,x,y,col,s){c.fillStyle=col;c.fillRect(x*s+1,y*s+1,s-2,s-2);c.fillStyle="rgba(255,255,255,.28)";c.fillRect(x*s+1,y*s+1,s-2,5)}
function draw(){cx.clearRect(0,0,300,600);cx.fillStyle="#2a1f16";cx.fillRect(0,0,300,600);
  cx.strokeStyle="rgba(255,255,255,.07)";for(let i=1;i<COLS;i++){cx.beginPath();cx.moveTo(i*CS,0);cx.lineTo(i*CS,600);cx.stroke()}for(let j=1;j<ROWS;j++){cx.beginPath();cx.moveTo(0,j*CS);cx.lineTo(300,j*CS);cx.stroke()}
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c])cell(cx,c,r,COL[grid[r][c]],CS);
  if(cur){let gy=cur.y;while(ok(cur.c,cur.x,gy+1))gy++;cx.globalAlpha=.25;cur.c.forEach(p=>cell(cx,cur.x+p[0],gy+p[1],COL[cur.t],CS));cx.globalAlpha=1;
    cur.c.forEach(p=>{if(cur.y+p[1]>=0)cell(cx,cur.x+p[0],cur.y+p[1],COL[cur.t],CS)})}}
function drawNext(){nx.clearRect(0,0,120,120);nx.fillStyle="#2a1f16";nx.fillRect(0,0,120,120);const xs=nxt.c.map(p=>p[0]),ys=nxt.c.map(p=>p[1]);const w=Math.max(...xs)-Math.min(...xs)+1,h=Math.max(...ys)-Math.min(...ys)+1;const s=24;const ox=(120-w*s)/2/s-Math.min(...xs),oy=(120-h*s)/2/s-Math.min(...ys);nxt.c.forEach(p=>cell(nx,p[0]+ox,p[1]+oy,COL[nxt.t],s))}
function begin(){grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));score=0;lines=0;bag=[];nxt=null;paused=false;running=true;$("bpause").textContent="잠깐 쉬기";upd();spawn();draw();clearInterval(timer);timer=setInterval(step,speed);
  $("start").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");sfx("start")}
function over(){running=false;clearInterval(timer);sfx("over");$("game").classList.add("hidden");$("end").classList.remove("hidden");
  $("res").textContent="점수 "+score+"점";$("resmsg").textContent="지운 줄 "+lines+"줄. "+(score>0&&score>=best?"최고 기록이에요! 대단하세요.":"잘하셨어요. 한 번 더 해 볼까요?");$("best0").textContent=best}
$("go").onclick=begin;$("again").onclick=begin;
document.querySelectorAll(".speeds button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".speeds button").forEach(x=>x.classList.remove("on"));b.classList.add("on");speed=parseInt(b.dataset.s)});
$("bpause").onclick=()=>{if(!running)return;paused=!paused;$("bpause").textContent=paused?"계속하기":"잠깐 쉬기"};
$("bdrop").onclick=drop;

/* 터치 버튼: 누르고 있으면 반복 */
function hold(id,fn,rep){const b=$(id);let t=null,s=null;const stop=()=>{clearTimeout(s);clearInterval(t);t=null};
  const go=e=>{e.preventDefault();fn();if(rep){s=setTimeout(()=>{t=setInterval(fn,rep)},320)}};
  b.addEventListener("touchstart",go,{passive:false});b.addEventListener("mousedown",go);
  ["touchend","touchcancel","mouseup","mouseleave"].forEach(ev=>b.addEventListener(ev,stop))}
hold("bl",()=>mv(-1),130);hold("br",()=>mv(1),130);hold("bd",down,90);hold("bu",turn,0);
document.addEventListener("keydown",e=>{if(!running)return;const k=e.key;
  if(k==="ArrowLeft"){e.preventDefault();mv(-1)}else if(k==="ArrowRight"){e.preventDefault();mv(1)}else if(k==="ArrowDown"){e.preventDefault();down()}else if(k==="ArrowUp"){e.preventDefault();turn()}else if(k===" "){e.preventDefault();drop()}else if(k==="p"||k==="P"){$("bpause").click()}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&running&&!paused){paused=true;$("bpause").textContent="계속하기"}});
</script>
</body>
</html>
