<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>길치와짐꾼 뱀 먹이 먹기</title>
<link rel="stylesheet" href="../common.css"><script src="../common.js"></script>
<style>
#cv{display:block;margin:10px auto;background:#e8f0c8;border:4px solid var(--main);border-radius:10px;width:min(92vw,420px);height:auto;aspect-ratio:1/1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px;margin:0 auto}
.pad button{height:74px;font-size:.85em;font-weight:700;border:3px solid var(--main);background:#fff;border-radius:16px;cursor:pointer}
.pad button:active{background:var(--accent)}
.speeds{display:flex;gap:8px;margin-top:8px}.speeds button{flex:1;font-size:.85em;padding:12px 2px;border:3px solid var(--main);background:#fff;border-radius:14px;font-weight:700;cursor:pointer}.speeds button.on{background:var(--accent)}
</style></head><body><div class="wrap">
<script>document.write(tools('뱀 먹이 먹기'))</script>
<section id="start" class="card"><p class="big">뱀에게<br>먹이를 먹여 주세요</p><p>빨간 먹이를 먹으면 뱀이 길어져요.<br>벽이나 자기 몸에 닿으면 끝나요.</p>
<div class="speeds"><button data-s="360">느림</button><button data-s="260" class="on">보통</button><button data-s="180">빠름</button></div>
<p class="small">최고 점수: <span id="best0">0</span></p><button class="primary" id="go">시작하기</button></section>
<section id="game" class="hidden"><div style="text-align:center"><span class="pill">점수 <b id="sc">0</b></span><span class="pill">최고 <b id="best">0</b></span></div>
<canvas id="cv" width="420" height="420"></canvas>
<div class="pad"><span></span><button id="bu">위</button><span></span><button id="bl">왼쪽</button><button id="bd">아래</button><button id="br">오른쪽</button></div></section>
<section id="end" class="card hidden"><p class="big" id="res"></p><p id="resmsg"></p><button class="primary" id="again">다시 하기</button></section>
<p class="back"><a href="../">게임방으로 돌아가기</a></p></div>
<script>
initTools();
const N=14,C=30,cv=$("cv"),cx=cv.getContext("2d");
let sn,dir,nd,food,sc,timer,speed=260,best=parseInt(load("best_snake","0"))||0,run=false;$("best0").textContent=best;$("best").textContent=best;
document.querySelectorAll(".speeds button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".speeds button").forEach(x=>x.classList.remove("on"));b.classList.add("on");speed=parseInt(b.dataset.s)});
function put(){do{food=[Math.floor(Math.random()*N),Math.floor(Math.random()*N)]}while(sn.some(p=>p[0]===food[0]&&p[1]===food[1]))}
function begin(){sn=[[6,7],[5,7],[4,7]];dir=[1,0];nd=[1,0];sc=0;run=true;$("sc").textContent=0;put();draw();clearInterval(timer);timer=setInterval(step,speed);
 $("start").classList.add("hidden");$("end").classList.add("hidden");$("game").classList.remove("hidden");sfx("start")}
function setd(x,y){if(!run)return;if(x===-dir[0]&&y===-dir[1])return;nd=[x,y];sfx("click")}
function step(){dir=nd;const h=[sn[0][0]+dir[0],sn[0][1]+dir[1]];
 if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||sn.some(p=>p[0]===h[0]&&p[1]===h[1])){over();return}
 sn.unshift(h);if(h[0]===food[0]&&h[1]===food[1]){sc++;$("sc").textContent=sc;sfx("eat");if(sc>best){best=sc;save("best_snake",best);$("best").textContent=best}put()}else sn.pop();draw()}
function draw(){cx.fillStyle="#e8f0c8";cx.fillRect(0,0,420,420);cx.strokeStyle="rgba(0,0,0,.05)";for(let i=1;i<N;i++){cx.beginPath();cx.moveTo(i*C,0);cx.lineTo(i*C,420);cx.stroke();cx.beginPath();cx.moveTo(0,i*C);cx.lineTo(420,i*C);cx.stroke()}
 cx.fillStyle="#d33";cx.beginPath();cx.arc(food[0]*C+C/2,food[1]*C+C/2,C/2-3,0,7);cx.fill();
 sn.forEach((p,i)=>{cx.fillStyle=i?"#3f8f3f":"#2a6b2a";cx.fillRect(p[0]*C+2,p[1]*C+2,C-4,C-4)});
 const h=sn[0];cx.fillStyle="#fff";cx.fillRect(h[0]*C+6,h[1]*C+8,5,5);cx.fillRect(h[0]*C+C-11,h[1]*C+8,5,5)}
function over(){run=false;clearInterval(timer);sfx("bad");setTimeout(()=>{$("game").classList.add("hidden");$("end").classList.remove("hidden");$("res").textContent="먹이 "+sc+"개!";$("resmsg").textContent=sc>=12?"대단하세요!":sc>=5?"아주 잘하셨어요.":"좋은 시작이에요. 다시 해 볼까요?"},600)}
$("bu").onclick=()=>setd(0,-1);$("bd").onclick=()=>setd(0,1);$("bl").onclick=()=>setd(-1,0);$("br").onclick=()=>setd(1,0);
document.addEventListener("keydown",e=>{const m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]}[e.key];if(m){e.preventDefault();setd(m[0],m[1])}});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&run){clearInterval(timer);run=false;over()}});
$("go").onclick=begin;$("again").onclick=begin;
</script></body></html>
