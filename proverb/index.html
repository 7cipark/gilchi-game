<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>길치와짐꾼 속담 퀴즈</title>
<style>
  :root{--bg:#fffaf0;--ink:#1d1d1d;--main:#1f6f5b;--accent:#f0a030;--ok:#1b7f3b;--bad:#b3261e;--fs:28px}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Noto Sans KR",sans-serif;font-size:var(--fs);line-height:1.5}
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  h1{font-size:1.3em;margin:8px 0;color:var(--main)}
  .tools button{font-size:.7em;padding:8px 14px;margin-left:6px;border:2px solid var(--main);background:#fff;border-radius:12px;cursor:pointer}
  .card{background:#fff;border:3px solid var(--main);border-radius:18px;padding:20px;margin:14px 0}
  .progress{font-size:.8em;color:#555}
  .q{font-size:1.25em;font-weight:700;margin:10px 0 18px}
  .q .blank{display:inline-block;min-width:2.5em;border-bottom:4px solid var(--accent)}
  .opt{display:block;width:100%;text-align:left;font-size:1em;padding:18px 16px;margin:12px 0;border:3px solid var(--main);background:#fff;border-radius:16px;cursor:pointer;min-height:64px}
  .opt:hover,.opt:focus{background:#e8f3f4;outline:none}
  .opt.ok{background:#dff3e4;border-color:var(--ok)}
  .opt.bad{background:#fbe3e0;border-color:var(--bad)}
  .msg{font-size:.95em;margin-top:12px;padding:14px;border-radius:12px;background:#fff3d6;display:none}
  .primary{display:block;width:100%;font-size:1.05em;padding:18px;margin-top:16px;border:0;border-radius:16px;background:var(--main);color:#fff;font-weight:700;cursor:pointer;min-height:68px}
  .center{text-align:center}
  .big{font-size:1.8em;font-weight:700}
  .small{font-size:.7em;color:#666}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>길치와짐꾼 속담 퀴즈</h1>
    <div class="tools">
      <button id="fm" aria-label="글자 작게">가-</button>
      <button id="fp" aria-label="글자 크게">가+</button>
      <button id="snd" aria-label="소리 켜기 끄기">소리 켜짐</button>
    </div>
  </header>

  <section id="start" class="card center">
    <p class="big">앞부분을 보고<br>뒷부분을 골라 보세요</p>
    <p>시간 제한이 없어요.<br>천천히 풀어 보세요.</p>
    <p class="small">오늘의 최고 점수: <span id="best">-</span></p>
    <button class="primary" id="go">시작하기 (10문제)</button>
  </section>

  <section id="play" class="card hidden">
    <div class="progress"><span id="no"></span> &nbsp;|&nbsp; 맞힌 개수 <span id="sc">0</span></div>
    <div class="q" id="q"></div>
    <div id="opts"></div>
    <div class="msg" id="msg"></div>
    <button class="primary hidden" id="next">다음 문제</button>
  </section>

  <section id="end" class="card center hidden">
    <p class="big" id="res"></p>
    <p id="resmsg"></p>
    <button class="primary" id="again">다시 하기</button>
  </section>

  <p id="donate" class="small center hidden">마음에 드셨다면 <a id="donateLink" href="#" target="_blank" rel="noopener" style="color:#0f5c63;font-weight:700">응원하기(선택)</a> &nbsp;·&nbsp; 게임은 계속 무료예요.</p>
  <p class="small center">길치와짐꾼 채널과 함께하는 속담 퀴즈예요. 즐거운 시간 되세요. 틀려도 괜찮아요.</p>
</div>

<script>
const DATA=[
["가는 말이 고와야","오는 말이 곱다","내가 말을 곱게 하면 상대도 곱게 대한다는 뜻이에요."],
["낮말은 새가 듣고","밤말은 쥐가 듣는다","아무도 없는 곳에서도 말조심하라는 뜻이에요."],
["호랑이도 제 말 하면","온다","다른 사람 이야기를 하면 그 사람이 나타난다는 뜻이에요."],
["원숭이도 나무에서","떨어진다","아무리 잘하는 사람도 실수할 수 있다는 뜻이에요."],
["소 잃고","외양간 고친다","일이 잘못된 뒤에야 손을 쓴다는 뜻이에요."],
["백지장도 맞들면","낫다","쉬운 일도 함께하면 더 쉽다는 뜻이에요."],
["세 살 버릇","여든까지 간다","어릴 때 습관은 오래간다는 뜻이에요."],
["티끌 모아","태산","작은 것도 모이면 큰 것이 된다는 뜻이에요."],
["아니 땐 굴뚝에","연기 날까","원인이 없으면 결과도 없다는 뜻이에요."],
["하늘이 무너져도","솟아날 구멍이 있다","어려워도 헤쳐 나갈 방법은 있다는 뜻이에요."],
["고래 싸움에","새우 등 터진다","힘센 사람들 싸움에 약한 사람이 피해를 본다는 뜻이에요."],
["열 길 물속은 알아도","한 길 사람 속은 모른다","사람의 마음은 알기 어렵다는 뜻이에요."],
["사공이 많으면","배가 산으로 간다","간섭하는 사람이 많으면 일이 잘못된다는 뜻이에요."],
["윗물이 맑아야","아랫물이 맑다","윗사람이 바르게 행동해야 아랫사람도 따른다는 뜻이에요."],
["말 한마디로","천 냥 빚을 갚는다","말을 잘하면 큰 어려움도 풀 수 있다는 뜻이에요."],
["같은 값이면","다홍치마","같은 조건이면 더 좋은 것을 고른다는 뜻이에요."],
["가재는","게 편","모양이나 처지가 비슷한 쪽끼리 편든다는 뜻이에요."],
["공든 탑이","무너지랴","정성껏 한 일은 헛되지 않는다는 뜻이에요."],
["개구리 올챙이 적","생각 못 한다","형편이 나아지면 지난 어려움을 잊는다는 뜻이에요."],
["꿩 먹고","알 먹는다","한 가지 일로 두 가지 이익을 본다는 뜻이에요."],
["등잔 밑이","어둡다","가까이 있는 것을 오히려 모른다는 뜻이에요."],
["모로 가도","서울만 가면 된다","방법이 어떻든 목적만 이루면 된다는 뜻이에요."],
["못 먹는 감","찔러나 본다","내가 못 가질 바에는 남도 못 갖게 훼방 놓는다는 뜻이에요."],
["병 주고","약 준다","해를 입힌 뒤에 도와주는 척한다는 뜻이에요."],
["서당 개 삼 년이면","풍월을 읊는다","오래 보고 들으면 자연스럽게 배운다는 뜻이에요."],
["얌전한 고양이","부뚜막에 먼저 올라간다","얌전해 보이는 사람이 먼저 일을 저지른다는 뜻이에요."],
["우물 안","개구리","보는 세상이 좁아 큰 세상을 모른다는 뜻이에요."],
["작은 고추가","맵다","몸집이 작아도 속은 야무지다는 뜻이에요."],
["지렁이도 밟으면","꿈틀한다","순한 사람도 너무 괴롭히면 화를 낸다는 뜻이에요."],
["첫술에","배부르랴","한 번에 만족할 수는 없다는 뜻이에요."],
["쇠귀에","경 읽기","아무리 가르쳐도 알아듣지 못한다는 뜻이에요."],
["천 리 길도","한 걸음부터","큰일도 작은 시작에서 이루어진다는 뜻이에요."],
["누워서","떡 먹기","아주 쉬운 일이라는 뜻이에요."],
["보기 좋은 떡이","먹기도 좋다","겉모양이 좋으면 속도 좋다는 뜻이에요."],
["뛰는 놈 위에","나는 놈 있다","잘하는 사람 위에는 더 잘하는 사람이 있다는 뜻이에요."],
["가는 날이","장날이다","우연히 일이 겹쳤다는 뜻이에요."],
["도둑이 제 발","저린다","잘못한 사람이 스스로 놀란다는 뜻이에요."],
["돌다리도","두들겨 보고 건너라","아는 길도 조심하라는 뜻이에요."],
["불난 집에","부채질한다","어려운 사람을 더 힘들게 한다는 뜻이에요."],
["빈 수레가","요란하다","속이 빈 사람이 더 시끄럽게 군다는 뜻이에요."]
];
const DONATE_URL=""; /* 후원 링크 주소를 여기에 넣으면 하단에 응원하기 링크가 나타납니다 */
const $=id=>document.getElementById(id);
if(DONATE_URL){$("donateLink").href=DONATE_URL;$("donate").classList.remove("hidden")}
let order=[],idx=0,score=0,sound=true,fs=28,locked=false;
function load(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
fs=parseInt(load("fs","32"));document.documentElement.style.setProperty("--fs",fs+"px");
$("best").textContent=load("best","-");
let AC=null,MG=null;
function tone(f,t0,d,type,vol){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor();c.threshold.value=-10;c.ratio.value=8;const m=AC.createGain();m.gain.value=1.6;c.connect(m);m.connect(AC.destination);MG=c}if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;o.connect(g);g.connect(MG);const s=AC.currentTime+t0;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(vol||0.4,s+0.015);g.gain.exponentialRampToValueAtTime(0.0001,s+d);o.start(s);o.stop(s+d+0.05)}catch(e){}}
function bell(f,t0,d,v){tone(f,t0,d,"sine",v);tone(f*2,t0,d*.7,"sine",v*.4);tone(f*3,t0,d*.4,"sine",v*.15)}
function sfx(k){if(!sound)return;
  if(k==="ok"){bell(1319,0,.55,.5);bell(1047,.38,.55,.5);bell(1568,.76,1.0,.55)}
  else if(k==="bad"){tone(150,0,.7,"sawtooth",.45);tone(158,0,.7,"square",.25)}
  else if(k==="click"){tone(700,0,.08,"square",.14)}
  else if(k==="start"){bell(523,0,.3,.45);bell(659,.14,.3,.45);bell(784,.28,.6,.5)}
  else if(k==="win"){[523,659,784,1047,784,1047,1319].forEach((f,i)=>bell(f,i*.17,.45,.55))}
  else if(k==="win8"){[523,659,784,1047,784,1047,1319].forEach((f,i)=>bell(f,i*.17,.45,.28))}
  else if(k==="fin"){bell(523,0,.35,.45);bell(659,.22,.35,.45);bell(784,.44,.7,.5)}}
function beep(ok){sfx(ok?"ok":"bad")}
function setFs(d){fs=Math.min(40,Math.max(22,fs+d));document.documentElement.style.setProperty("--fs",fs+"px");save("fs",fs)}
$("fm").onclick=()=>setFs(-3);$("fp").onclick=()=>setFs(3);
sound=load("snd_on","1")==="1";$("snd").textContent=sound?"소리 켜짐":"소리 꺼짐";
$("snd").onclick=()=>{sound=!sound;save("snd_on",sound?"1":"0");$("snd").textContent=sound?"소리 켜짐":"소리 꺼짐";sfx("ok")};
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){order=shuffle([...DATA.keys()]).slice(0,10);idx=0;score=0;$("sc").textContent=0;$("start").classList.add("hidden");$("end").classList.add("hidden");$("play").classList.remove("hidden");show()}
function show(){locked=false;const d=DATA[order[idx]];$("no").textContent=(idx+1)+" / 10 문제";
  $("q").innerHTML=d[0]+' <span class="blank">&nbsp;</span>';
  const cand=[...DATA.keys()].filter(i=>i!==order[idx]).sort((a,b)=>Math.abs(DATA[a][1].length-d[1].length)-Math.abs(DATA[b][1].length-d[1].length)).slice(0,8);
  const wrong=shuffle(cand).slice(0,2).map(i=>DATA[i][1]);
  const opts=shuffle([d[1],...wrong]);$("opts").innerHTML="";
  opts.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>pick(b,t===d[1],d);$("opts").appendChild(b)});
  $("msg").style.display="none";$("next").classList.add("hidden")}
function pick(b,ok,d){if(locked)return;locked=true;
  [...document.querySelectorAll(".opt")].forEach(x=>{if(x.textContent===d[1])x.classList.add("ok")});
  if(ok){score++;$("sc").textContent=score;$("msg").textContent="정답이에요! "+d[0]+" "+d[1]+" — "+d[2]}
  else{b.classList.add("bad");$("msg").textContent="아쉬워요. 정답은 「"+d[1]+"」예요. "+d[2]}
  $("msg").style.display="block";beep(ok);$("next").textContent=idx<9?"다음 문제":"결과 보기";$("next").classList.remove("hidden");$("next").focus()}
$("next").onclick=()=>{sfx("click");if(idx<9){idx++;show()}else finish()};
function finish(){$("play").classList.add("hidden");$("end").classList.remove("hidden");
  sfx(score===10?"win":score>=8?"win8":score>=6?"fin":"bad");$("res").style.color=score>=8&&score<10?"#e6a700":"";$("res").style.textShadow=score>=8&&score<10?"0 0 2px #5a3a00,1px 1px 0 #5a3a00":"";$("res").textContent="10문제 중 "+score+"개 맞히셨어요!";
  $("resmsg").textContent=score>=9?"대단하세요! 속담 박사님이시네요.":score>=6?"아주 잘하셨어요. 한 번 더 해 볼까요?":"좋은 시작이에요. 다시 하면 더 잘하실 거예요.";
  const b=parseInt(load("best","0"))||0;if(score>b){save("best",score);$("best").textContent=score}}
$("go").onclick=()=>{sfx("start");start()};$("again").onclick=()=>{sfx("start");start()};
</script>
</body>
</html>
